name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Next.js production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: demo/package-lock.json

      - name: Install dependencies
        # npm ci requires lockfile fully in sync; regenerate locally after dep changes.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: demo
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_DEMO_VERSION: '0.1.0'
